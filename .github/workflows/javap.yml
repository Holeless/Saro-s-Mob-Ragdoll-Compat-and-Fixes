name: Dump Saro classes

on:
  workflow_dispatch:

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Get Saro jar
        env:
          SARO_JAR_URL: ${{ secrets.SARO_JAR_URL }}
        run: |
          mkdir -p libs
          if ls libs/*.jar >/dev/null 2>&1; then
            echo "Using jar from libs/"
          elif [ -n "$SARO_JAR_URL" ]; then
            curl -fsSL -o libs/saro.jar "$SARO_JAR_URL"
          else
            echo "::error::No jar. Put it in libs/ or set SARO_JAR_URL."
            exit 1
          fi

      - name: javap
        run: |
          JAR=$(ls libs/*.jar | head -n1)
          mkdir -p dump
          javap -p -c -cp "$JAR" \
            de.sarocesch.sarosmobragdoll.client.skeleton.VanillaModelSkeletonProvider \
            'de.sarocesch.sarosmobragdoll.client.skeleton.VanillaModelSkeletonProvider$BabyTransform' \
            'de.sarocesch.sarosmobragdoll.client.skeleton.VanillaModelSkeletonProvider$BoneBuild' \
            'de.sarocesch.sarosmobragdoll.client.skeleton.VanillaModelSkeletonProvider$NamedPart' \
            de.sarocesch.sarosmobragdoll.client.skeleton.LayerProbe \
            de.sarocesch.sarosmobragdoll.client.skeleton.SkeletonLayer \
            de.sarocesch.sarosmobragdoll.client.skeleton.SkeletonProvider \
            de.sarocesch.sarosmobragdoll.client.skeleton.ModelPartAccess \
            > dump/provider.txt
          javap -p -c -cp "$JAR" \
            de.sarocesch.sarosmobragdoll.ragdoll.physics.BoneRagdollPhysics \
            > dump/physics.txt

      - uses: actions/upload-artifact@v4
        with:
          name: saro-dump-2
          path: dump/
